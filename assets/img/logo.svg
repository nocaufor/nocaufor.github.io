<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="nocau">
  <style>
    /* NOCAU dynamic layers: pure CSS animation, no inline script, CSP-friendly
       1) key strokes flowing via stroke-dashoffset
       2) default ultra-slow self rotation 60s
       3) center core pulse glow (low-saturation cyan, subtle) */
    @keyframes nc-f-a { to { stroke-dashoffset: -190; } }
    @keyframes nc-f-b { to { stroke-dashoffset: -150; } }
    @keyframes nc-f-c { to { stroke-dashoffset: -330; } }
    @keyframes nc-spin { to { transform: rotate(360deg); } }
    @keyframes nc-pulse { 0%, 100% { opacity: 0.62; } 50% { opacity: 1; } }
    @keyframes nc-glow { 0%, 100% { opacity: 0.14; transform: scale(0.86); } 50% { opacity: 0.42; transform: scale(1.22); } }
    .nc-spin { transform-origin: 32px 32px; animation: nc-spin 60s linear infinite; }
    .nc-f-a { stroke-dasharray: 60 130; animation: nc-f-a 6s linear infinite; }
    .nc-f-b { stroke-dasharray: 30 120; animation: nc-f-b 5s linear infinite; }
    .nc-f-c { stroke-dasharray: 70 260; animation: nc-f-c 7.5s linear infinite; }
    .nc-pulse { transform-origin: 32px 32px; animation: nc-pulse 3.4s ease-in-out infinite; }
    .nc-glow { transform-origin: 32px 32px; animation: nc-glow 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .nc-spin, .nc-f-a, .nc-f-b, .nc-f-c, .nc-pulse, .nc-glow { animation: none; }
    }
  </style>
  <!--
    NOCAU 标识 · 数学科学符号体系
    1) 外圈圆环（度量环）：圆周率/度量结构（秩序与精密，无横纵坐标轴点）
    2) 正六边形：蜂窝秩序 / 几何切割（结构感）
    3) 黄金对数螺旋：斐波那契生长（从中心核向外 1.5 圈）
    4) 椭圆原子轨道：科学运行
    5) 中心核点：能量核心
    黑白灰极简 · stroke=currentColor · 无繁琐节点
  -->
  <g class="nc-spin" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- 度量环（无刻度点） -->
    <circle class="nc-f-a" cx="32" cy="32" r="29.5" stroke-width="1.1"/>
    <!-- 正六边形（外接圆 r=24，平顶式） -->
    <polygon class="nc-f-b" stroke-width="1.8" points="32,8 52.78,20 52.78,44 32,56 11.22,44 11.22,20"/>
    <!-- 黄金对数螺旋（1.5 圈，自中心核向外） -->
    <polyline class="nc-f-c" stroke-width="1.5" points="32.0,27.4 32.561,27.345 33.136,27.357 33.717,27.44 34.294,27.594 34.859,27.821 35.404,28.119 35.918,28.488 36.394,28.924 36.822,29.423 37.195,29.98 37.504,30.59 37.742,31.245 37.904,31.936 37.983,32.656 37.975,33.394 37.877,34.14 37.686,34.883 37.403,35.612 37.028,36.314 36.562,36.98 36.009,37.597 35.374,38.153 34.664,38.639 33.886,39.044 33.049,39.36 32.164,39.576 31.241,39.688 30.294,39.688 29.335,39.572 28.379,39.338 27.44,38.985 26.532,38.512 25.672,37.924 24.873,37.223 24.149,36.416 23.516,35.511 22.985,34.518 22.569,33.448 22.279,32.315 22.123,31.132 22.11,29.917 22.245,28.685 22.532,27.454 22.972,26.244 23.566,25.073 24.31,23.96 25.198,22.925 26.224,21.985 27.376,21.16 28.643,20.465 30.01,19.916 31.461,19.528 32.977,19.311 34.537,19.278 36.12,19.434 37.703,19.785 39.262,20.334 40.774,21.079 42.212,22.018 43.553,23.144 44.773,24.447 45.849,25.915 46.758,27.532 47.481,29.279 48.0,31.135 48.299,33.078 48.364,35.08 48.185,37.114 47.756,39.15 47.073,41.159 46.137,43.109 44.952,44.968 43.526,46.705 41.87,48.289 40.001,49.69 37.939,50.879 35.707,51.832 33.331,52.523"/>
    <!-- 原子轨道椭圆（-30° 倾斜） -->
    <ellipse cx="32" cy="32" rx="16" ry="6.4" stroke-width="1.2" transform="rotate(-30 32 32)"/>
  </g>
  <!-- 中心核 -->
    <circle class="nc-glow" cx="32" cy="32" r="7.4" fill="rgba(150,196,196,1)"/>
  <circle class="nc-pulse" cx="32" cy="32" r="2.7" fill="currentColor"/>
</svg>
