<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系 · nocau</title>
  <meta name="description" content="联系 nocau：邮箱、社交、留言表单。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body>

  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- 光标跟随光晕与圆点（桌面端） -->
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>

  <!-- ==================== 顶部导航 ==================== -->
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="brand-logo">nc</span>
        <span class="brand-name">nocau</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="index.html">首页</a>
          <a href="projects.html">作品集</a>
          <a href="about.html">关于</a>
          <a href="contact.html">联系</a>
        </nav>
        <button id="visual-toggle" class="visual-toggle" aria-label="切换渐变风格">MONO</button>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ==================== 联系 ==================== -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-tag">Contact</span>
          <div class="section-divider"></div>
          <h1 class="section-title">联系<span class="gradient-text">nocau</span></h1>
          <p class="section-desc">合作、交流或任何想法，欢迎随时联系。</p>
        </div>

        <div class="contact-layout">
          <!-- 联系方式 -->
          <div class="contact-methods reveal">
            <div class="contact-method">
              <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.4 8.5-6.4"/></svg></div>
              <div>
                <h4>邮箱</h4>
                <p>hello@nocau.com</p>
              </div>
            </div>
            <div class="contact-method">
              <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg></div>
              <div>
                <h4>GitHub</h4>
                <p>github.com/nocau</p>
              </div>
            </div>
            <div class="contact-method">
              <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l2.1-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></svg></div>
              <div>
                <h4>微信</h4>
                <p>nocau-dev</p>
              </div>
            </div>
          </div>

          <!-- 留言表单（纯前端演示，无后端） -->
          <div class="contact-form reveal">
            <h3 style="font-size: 1.25rem; margin-bottom: 24px; font-weight: 800">给我留言</h3>
            <form id="contact-form" novalidate>
              <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="你的名字" autocomplete="name" maxlength="50" required />
              </div>
              <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" autocomplete="email" maxlength="120" required />
              </div>
              <div class="form-group">
                <label for="message">留言内容</label>
                <textarea id="message" name="message" class="form-control" placeholder="想聊点什么？" rows="5" maxlength="1000" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">发送留言</button>
              <p id="form-message" class="form-message"></p>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <span class="mini-logo">nc</span>
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">首页</a>
        <a href="projects.html">作品集</a>
        <a href="about.html">关于</a>
      </nav>
    </div>
  </footer>

  <button id="back-to-top" class="back-to-top" aria-label="回到顶部"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
