<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星空数据库 · nocau</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="description" content="nocau 星空数据库：所有代码开发项目与想法方案，以 3D 星空形式呈现。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/stars3d.css" />
  <link rel="stylesheet" href="assets/css/star-db.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body>

  <div class="bg-fog" aria-hidden="true"></div>

  <!-- ==================== 顶部导航 ==================== -->
  <header class="site-header star-db-header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <img class="brand-logo" src="assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="index.html" data-i18n="nav_home">首页</a>
          <a href="fun/index.html" data-i18n="nav_fun">代码开发</a>
          <a href="ideas.html" data-i18n="nav_ideas">想法项目</a>
          <a href="star-db.html" data-i18n="nav_stars">星空数据库</a>
          <a href="about.html" data-i18n="nav_about">关于</a>
          <a href="contact.html" data-i18n="nav_contact">联系</a>

        </nav>
        <button type="button" class="lang-toggle" data-lang-toggle aria-label="切换语言" data-i18n-attr="aria-label=lang_aria">EN</button>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式" data-i18n-attr="aria-label=theme_aria">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" data-i18n-attr="aria-label=nav_aria" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main star-db-main">

    <!-- ============ 3D 星空展示区（唯一主体：控制栏悬浮、粒子层、详情面板） ============ -->
    <section class="section-panel stars-section star-db-stage" id="sec-stars" aria-label="3D 星空数据库">
      <div class="star-db-controls">
        <div class="star-db-search-wrap">
          <svg class="star-db-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="star-db-search" class="star-db-search" type="search" placeholder="搜索编号 / 名称 / 关键词…" data-i18n-attr="placeholder=star_db_search_ph" autocomplete="off" />
          <button id="star-db-search-clear" class="star-db-search-clear" type="button" aria-label="清空搜索" data-i18n-attr="aria-label=star_db_clear_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <span id="star-db-search-hit" class="star-db-search-hit" aria-live="polite"></span>
        </div>
        <div id="star-db-filter" class="filter-bar star-db-filter">
          <button class="filter-btn active" data-filter="all" data-i18n="btn_all">全部</button>
          <button class="filter-btn" data-filter="ent" data-i18n="star_db_ent">娱乐代码</button>
          <button class="filter-btn" data-filter="func" data-i18n="star_db_func">功能代码</button>
          <button class="filter-btn" data-filter="dev" data-i18n="star_db_dev">实用代码</button>
          <button class="filter-btn" data-filter="idea" data-i18n="star_db_idea">想法方案</button>
        </div>
        <div class="star-db-toolbar">
          <label class="star-db-sort">
            <select id="star-db-sort" class="star-db-sort-select">
              <option value="code-asc" data-i18n="star_db_sort_code_asc">编号 ↑</option>
              <option value="code-desc" data-i18n="star_db_sort_code_desc">编号 ↓</option>
              <option value="heat" data-i18n="star_db_sort_heat">热度</option>
              <option value="name" data-i18n="star_db_sort_name">名称</option>
            </select>
          </label>
          <span id="star-db-count" class="star-db-count" data-i18n-html="star_db_count">共 144 颗星星</span>
        </div>
      </div>
      <canvas id="stars-canvas" aria-hidden="true"></canvas>
      <canvas id="star-particle-layer" class="star-particle-layer" aria-hidden="true"></canvas>
      <div id="star-db-empty-3d" class="star-db-empty" hidden>
        <div class="star-db-empty-inner">
          <svg class="star-db-empty-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          <h3 class="star-db-empty-title" data-i18n="star_db_empty_title">没有找到匹配的星星</h3>
          <button type="button" class="btn btn-outline btn-sm star-db-empty-reset" data-i18n="star_db_empty_reset">清空筛选</button>
        </div>
      </div>
      <div class="star-panel-mask" id="star-panel-mask" hidden></div>
      <aside class="star-panel" id="star-panel" role="dialog" aria-modal="true" aria-labelledby="star-name" hidden>
        <button type="button" class="star-panel-close" id="star-close" aria-label="关闭" data-i18n-attr="aria-label=stars3d_close_aria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="star-panel-head">
          <span class="star-panel-code" id="star-code"></span>
          <span class="star-panel-type tag" id="star-type"></span>
          <span class="star-panel-size" id="star-size"></span>
        </div>
        <h3 class="star-panel-name" id="star-name"></h3>
        <p class="star-panel-desc" id="star-desc"></p>
        <div class="star-panel-actions">
          <button type="button" class="btn btn-primary btn-sm star-rate-btn" id="star-like" data-i18n="stars3d_like">赞一下</button>
          <button type="button" class="btn btn-outline btn-sm star-rate-btn" id="star-dislike" data-i18n="stars3d_dislike">不感兴趣</button>
        </div>
        <div class="star-panel-links">
          <a class="btn btn-primary btn-sm" id="star-link" href="#" target="_self">查看项目</a>
          <a class="btn btn-outline btn-sm" id="star-link2" href="#" target="_self" hidden>查看相关想法</a>
        </div>
      </aside>
    </section>

  </main>

  <button id="back-to-top" class="back-to-top" aria-label="回到顶部" data-i18n-attr="aria-label=back_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/star-data.js"></script>
  <script src="assets/js/star-db.js"></script>
</body>
</html>
