  <main class="fun-main">
    <div class="fun-intro">
      <h1>正则测试器</h1>
      <p>实时测试 JavaScript 正则：匹配高亮、分组展示与语法错误提示。</p>
    </div>
    <div class="fun-box">
      <style>
        .r-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:900px}
        .r-field{display:flex;flex-direction:column;gap:6px;text-align:left}
        .r-field label{font-size:0.8rem;opacity:.8}
        .r-input{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:8px 12px;font-family:Consolas,Menlo,monospace;font-size:0.85rem;resize:vertical}
        .r-input:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .r-flags{display:flex;gap:12px;font-size:0.85rem;align-items:center;flex-wrap:wrap;justify-content:center}
        .r-output{background:var(--color-card,#1e1e24);border-radius:10px;padding:12px;min-height:150px;max-height:40vh;overflow:auto;white-space:pre-wrap;font-size:0.85rem;line-height:1.8;text-align:left}
        .r-status{font-size:0.85rem;min-height:1.2em}
        .r-err{color:#e06c75}
        mark{background:#e5c07b;color:#222;border-radius:3px;padding:0 2px}
        .r-groups{font-size:0.8rem;text-align:left;opacity:.9;min-height:1.4em}
      </style>
      <div class="r-wrap">
        <div class="r-field"><label for="r-pattern">正则表达式</label>
          <input id="r-pattern" class="r-input" value="(\w+)@(\w+)\.(com|cn)" spellcheck="false" aria-label="正则表达式" />
        </div>
        <div class="r-field"><label for="r-text">测试文本</label>
          <textarea id="r-text" class="r-input" rows="4" spellcheck="false" aria-label="测试文本">联系 nocau@example.com 或 hello@example.cn</textarea>
        </div>
        <div class="r-flags">
          <label><input type="checkbox" id="r-g" checked /> 全局 g</label>
          <label><input type="checkbox" id="r-i" /> 忽略大小写 i</label>
          <label><input type="checkbox" id="r-m" /> 多行 m</label>
          <label><input type="checkbox" id="r-s" /> 点匹配换行 s</label>
        </div>
        <div class="r-output" id="r-output"></div>
        <p id="r-status" class="r-status"></p>
        <div class="r-groups" id="r-groups"></div>
      </div>
    </div>
