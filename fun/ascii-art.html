  <meta name="description" content="把照片/图片转为字符画 ASCII Art：亮度映射 + 可调密度与行宽，全部本地实现，图片不上传。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />

</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>字符画转换 · ASCII Art</h1>
      <p>亮度映射转纯文本字符画。支持上传图片或点“示例图”；文字区域可一键复制。全部本地计算，不上传图片。</p>
    </div>
    <div class="fun-box">
      <style>
        .as-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:860px;padding:18px}
        .as-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .as-opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .as-stage{display:none;width:100%;max-width:520px}
        .as-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:12px}
        .as-out{width:100%;max-width:860px;background:#080b10;border:1px solid var(--color-border,#28303c);border-radius:12px;color:#b9c6dd;font-family:"Cascadia Mono","SF Mono",Consolas,"Courier New",monospace;font-size:11px;line-height:1.25;padding:14px;overflow:auto;white-space:pre;max-height:520px}
        .as-copy{font-size:0.82rem}
      </style>
      <div class="as-wrap">
        <div class="as-bar">
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="as-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="as-sample" class="btn btn-outline">示例图</button>
          <button type="button" id="as-copy" class="btn btn-outline">复制文字</button>
        </div>
        <div class="as-opts">
          <label>字符密度
            <select id="as-mode">
              <option value="0">稀疏</option>
              <option value="1" selected>标准</option>
              <option value="2">细腻</option>
            </select>
          </label>
          <label>宽度限制 <input id="as-cols" type="number" min="40" max="200" value="110" style="width:64px;background:#0d1117;color:var(--color-text,#e8eefb);border:1px solid var(--color-border,#28303c);border-radius:8px;padding:3px 8px"></label>
          <span>字符集：<code>@%#*+=-:. </code></span>
        </div>
        <div class="as-stage" id="as-stage"><canvas id="as-canvas" width="600" height="420" aria-label="原图预览"></canvas></div>
        <div class="as-out" id="as-out" aria-live="polite">字符画会显示在这里。</div>
        <p class="as-copy" id="as-status" style="color:var(--color-muted,#9aa3b2)">上传图片或点击“示例图”开始。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">

        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/ascii-art.js"></script>
</body>
</html>
