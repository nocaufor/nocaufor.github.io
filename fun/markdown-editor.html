        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>

      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>Markdown 编辑器</h1>
      <p>左侧写作右侧实时预览，支持标题、列表、代码块、表格等常用语法。</p>
    </div>
    <div class="fun-box">
      <style>
        .md-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:1000px}
        .md-panel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .md-split{display:flex;gap:10px;flex-wrap:wrap}
        .md-editor,.md-preview{flex:1 1 300px;min-height:380px;max-height:60vh;overflow:auto;border-radius:10px;background:var(--color-card,#1e1e24);padding:12px;font-size:0.9rem;line-height:1.7}
        .md-editor{width:100%;color:var(--color-text,#e8e8ea);font-family:Consolas,Menlo,monospace;resize:vertical;border:1px solid var(--color-border,#333)}
        .md-editor:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .md-preview h1,.md-preview h2,.md-preview h3{margin:.6em 0 .3em;line-height:1.3}
        .md-preview h1{font-size:1.5rem}.md-preview h2{font-size:1.25rem}.md-preview h3{font-size:1.05rem}
        .md-preview code{background:var(--color-bg,#121216);padding:.1em .35em;border-radius:4px;font-family:Consolas,Menlo,monospace;font-size:.85em}
        .md-preview pre{background:var(--color-bg,#121216);padding:10px;border-radius:8px;overflow:auto}
        .md-preview pre code{background:none;padding:0}
        .md-preview blockquote{border-left:3px solid var(--color-accent,#7aa2f7);margin:.5em 0;padding:.2em .8em;opacity:.85}
        .md-preview table{border-collapse:collapse;margin:.5em 0}
        .md-preview th,.md-preview td{border:1px solid var(--color-border,#333);padding:4px 10px}
        .md-preview img{max-width:100%}
        .md-preview a{color:var(--color-accent,#7aa2f7)}
      </style>
      <div class="md-wrap">
        <div class="md-panel">
          <button type="button" id="md-sample" class="btn btn-outline">示例文档</button>
          <button type="button" id="md-clear" class="btn btn-outline">清空</button>
          <button type="button" id="md-copy" class="btn btn-primary">复制 HTML</button>
        </div>
        <div class="md-split">
          <textarea id="md-input" class="md-editor" spellcheck="false" aria-label="Markdown 输入区" placeholder="# 在这里输入 Markdown…"></textarea>
          <div id="md-output" class="md-preview"></div>
        </div>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>

</body>
