  <meta name="description" content="鱼眼 / 膨胀 / 漩涡 / 波纹四种逐像素重映射扭曲，强度实时可调，支持示例图与本地图片，纯本地 Canvas 像素处理。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />

<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>镜头扭曲滤镜</h1>
      <p>对每个输出像素做逆映射回源图采样：鱼眼向中心放大、漩涡螺旋、波纹径向起伏。选“无扭曲”可随时回到原图。</p>
    </div>
    <div class="fun-box">
      <style>
        .ld-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:900px;padding:16px}
        .ld-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .ld-cvs{width:100%;max-width:760px}
        .ld-cvs canvas{display:block;width:100%;height:auto;background:#0a0d12;border:1px solid var(--color-border,#28303c);border-radius:12px}
        .ld-ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;align-items:center;font-size:0.85rem;color:var(--color-muted,#9aa3b2)}
        .ld-ctrl select{vertical-align:middle}
        .ld-status{font-size:0.8rem;color:var(--color-muted,#9aa3b2);min-height:1.2em;text-align:center}
      </style>
      <div class="ld-wrap">
        <div class="ld-bar">
          <button type="button" id="ld-sample" class="btn btn-outline">示例图</button>
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="ld-file" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="ld-cvs"><canvas id="ld-canvas" width="720" height="500" aria-label="扭曲滤镜画布"></canvas></div>
        <div class="ld-ctrl">
          <label>扭曲强度 <input id="ld-strength" type="range" min="0" max="100" value="60" /></label>
          <label>效果
            <select id="ld-effect">
              <option value="none">无扭曲</option>
              <option value="fish" selected>鱼眼（中心放大）</option>
              <option value="bulge">膨胀（中心鼓起）</option>
              <option value="swirl">漩涡</option>
              <option value="wave">波纹</option>
            </select>
          </label>
        </div>
        <p class="ld-status" id="ld-status"></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/lens-distort.js"></script>
</body>
</html>
