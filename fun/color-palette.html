  <main class="fun-main">
    <div class="fun-intro">
      <h1>调色板</h1>
      <p>取色、色值转换与配色生成：HEX/RGB/HSL 互转，一键复制色板。</p>
    </div>
    <div class="fun-box">
      <style>
        .c-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px}
        .c-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
        .c-swatch{width:54px;height:54px;border-radius:10px;border:1px solid var(--color-border,#333);cursor:pointer;position:relative;overflow:hidden}
        .c-swatch input{position:absolute;inset:0;opacity:0;cursor:pointer}
        .c-info{font-family:Consolas,Menlo,monospace;font-size:0.85rem;text-align:center}
        .c-palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .c-chip{width:64px;height:76px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;cursor:pointer;border:1px solid var(--color-border,#333)}
        .c-chip span{background:rgba(0,0,0,.45);color:#fff;font-size:0.68rem;padding:2px 6px;border-radius:4px;font-family:Consolas,Menlo,monospace}
        .c-help{font-size:0.8rem;opacity:.75;text-align:center}
      </style>
      <div class="c-wrap">
        <div class="c-row">
          <span class="c-swatch"><input type="color" id="c-picker" value="#7aa2f7" aria-label="取色器" /></span>
          <div class="c-info" id="c-info">#7AA2F7</div>
          <button type="button" id="c-copy" class="btn btn-primary">复制当前色</button>
        </div>
        <div class="c-row">
          <button type="button" id="c-analog" class="btn btn-outline">邻近色</button>
          <button type="button" id="c-complement" class="btn btn-outline">互补色</button>
          <button type="button" id="c-triadic" class="btn btn-outline">三角色</button>
          <button type="button" id="c-shades" class="btn btn-outline">明度阶梯</button>
        </div>
        <div id="c-palette" class="c-palette"></div>
        <p class="c-help">点击色块复制 HEX · 点击色板中的色块同样可复制</p>
      </div>
    </div>
