  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob:" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>图片文字识别 · Tesseract.js</h1>
      <p>开源 <a href="https://github.com/naptha/tesseract.js" target="_blank" rel="noopener">Tesseract.js</a> 纯浏览器 OCR：首次运行会从 CDN 下载约 10~15MB 中英文识别模型，之后由浏览器缓存。图片不会上传。</p>
    </div>
    <div class="fun-box">
      <style>
        .ocr-wrap{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%;max-width:820px;padding:18px}
        .ocr-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
        .ocr-bar .btn{min-width:96px}
        .ocr-stage{width:100%;max-width:640px}
        .ocr-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:12px}
        .ocr-out{width:100%;max-width:640px;min-height:120px;background:#0a0d12;border:1px solid var(--color-border,#28303c);border-radius:12px;color:var(--color-text,#e8eefb);padding:14px;font-size:0.9rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
        .ocr-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
        .ocr-opt{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .ocr-opt select{background:#0d1117;color:var(--color-text,#e8eefb);border:1px solid var(--color-border,#28303c);border-radius:8px;padding:5px 10px}
      </style>
      <div class="ocr-wrap">
        <div class="ocr-bar">
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="ocr-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="ocr-sample" class="btn btn-outline">识别示例图</button>
        </div>
        <div class="ocr-opt">
          <label>语言：
            <select id="ocr-lang">
              <option value="eng">English</option>
              <option value="chi_sim" selected>中文简体（体积更大）</option>
              <option value="chi_sim+eng">中英混合</option>
            </select>
          </label>
        </div>
        <div class="ocr-stage"><canvas id="ocr-canvas" width="640" height="220" aria-label="待识别图片"></canvas></div>
        <div class="ocr-out" id="ocr-out" aria-live="polite">识别文字会显示在这里。</div>
        <p class="ocr-status" id="ocr-status">加载 Tesseract.js 库中…</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>

      </span>

        <a href="index.html">代码开发合集</a>

      </nav>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="js/fun-common.js"></script>
  <script src="js/ocr-text.js"></script>
</body>
</html>
