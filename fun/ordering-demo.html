  <main class="fun-main">
    <div class="fun-intro">
      <h1>扫码点餐轻量后台</h1>
      <p>源自想法 B000006：菜单管理、桌台下单与经营统计一体化的轻量演示后台。</p>
    </div>
    <div class="fun-box">
      <style>
        .o-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:1020px}
        .o-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
        .o-tab{padding:6px 16px;border-radius:999px;cursor:pointer;font-size:0.85rem;border:1px solid var(--color-border,#333);background:var(--color-card,#1e1e24)}
        .o-tab.active{background:var(--color-accent,#7aa2f7);color:#fff;border-color:transparent}
        .o-pane{display:none;flex-direction:column;gap:10px}
        .o-pane.active{display:flex}
        .o-form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
        .o-field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:0.8rem}
        .o-field input,.o-field select{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:7px 10px;font-size:0.85rem}
        .o-field input:focus,.o-field select:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .o-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
        .o-dish{background:var(--color-card,#1e1e24);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:0.85rem}
        .o-dish .price{color:#e5c07b;font-weight:700}
        .o-dish .btn{padding:5px 8px;font-size:0.78rem}
        .o-dish.on .btn{background:#98c379;color:#222}
        .o-sum{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .o-sum div{background:var(--color-card,#1e1e24);border-radius:10px;padding:10px 14px;text-align:center;font-size:0.85rem;flex:1 1 130px}
        .o-sum b{display:block;font-size:1.05rem;margin-top:4px}
        .o-orders{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
        .o-order{background:var(--color-card,#1e1e24);border-radius:10px;padding:10px 12px;font-size:0.85rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
        .o-order .items{opacity:.85;font-size:0.8rem}
        .o-order .t{font-family:Consolas,Menlo,monospace;font-size:0.75rem;opacity:.7}
      </style>
      <div class="o-wrap">
        <div class="o-tabs">
          <span class="o-tab active" data-tab="menu">菜单管理</span>
          <span class="o-tab" data-tab="table">桌台下单</span>
          <span class="o-tab" data-tab="stat">经营统计</span>
        </div>
        <div class="o-pane active" data-pane="menu">
          <div class="o-form">
            <span class="o-field"><label>菜名</label><input id="o-name" placeholder="如 番茄炒蛋" /></span>
            <span class="o-field"><label>价格</label><input type="number" id="o-price" min="0" step="0.5" placeholder="18" /></span>
            <span class="o-field"><label>分类</label><select id="o-cat"><option>热菜</option><option>凉菜</option><option>主食</option><option>饮品</option></select></span>
            <button type="button" id="o-add" class="btn btn-primary">添加菜品</button>
          </div>
          <div class="o-grid" id="o-menu"></div>
        </div>
        <div class="o-pane" data-pane="table">
          <div class="o-form">
            <span class="o-field"><label>桌台</label><select id="o-table"></select></span>
            <span class="o-field"><label>菜品</label><select id="o-dish"></select></span>
            <span class="o-field"><label>数量</label><input type="number" id="o-qty" value="1" min="1" style="width:70px" /></span>
            <button type="button" id="o-order" class="btn btn-primary">下单</button>
          </div>
          <div class="o-orders" id="o-orders"></div>
        </div>
        <div class="o-pane" data-pane="stat">
          <div class="o-sum">
            <div>今日订单<b id="o-count">0</b></div>
            <div>今日营业额<b id="o-total">0.00</b></div>
            <div>在售菜品<b id="o-dish-count">0</b></div>
          </div>
          <div class="o-orders" id="o-stat-list"></div>
        </div>
        <div class="o-actions" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button type="button" id="o-sample" class="btn btn-outline">示例数据</button>
          <button type="button" id="o-clear" class="btn btn-outline">清空全部</button>
        </div>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
