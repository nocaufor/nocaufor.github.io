  <main class="fun-main">
    <div class="fun-intro">
      <h1>家庭用药与健康档案</h1>
      <p>源自想法 B000004：家庭成员用药提醒、血压血糖记录与电子健康档案。</p>
    </div>
    <div class="fun-box">
      <style>
        .m-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:980px}
        .m-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
        .m-tab{padding:6px 16px;border-radius:999px;cursor:pointer;font-size:0.85rem;border:1px solid var(--color-border,#333);background:var(--color-card,#1e1e24)}
        .m-tab.active{background:var(--color-accent,#7aa2f7);color:#fff;border-color:transparent}
        .m-pane{display:none;flex-direction:column;gap:10px}
        .m-pane.active{display:flex}
        .m-form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
        .m-field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:0.8rem}
        .m-field input,.m-field select{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:7px 10px;font-size:0.85rem}
        .m-field input:focus,.m-field select:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .m-list{display:flex;flex-direction:column;gap:8px}
        .m-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--color-card,#1e1e24);border-radius:10px;padding:10px 12px;font-size:0.85rem;flex-wrap:wrap}
        .m-item .t{font-weight:700}
        .m-item .s{opacity:.7;font-size:0.78rem}
        .m-item .del{cursor:pointer;color:#e06c75;font-size:0.9rem}
        .m-stat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .m-stat div{background:var(--color-card,#1e1e24);border-radius:10px;padding:10px 14px;text-align:center;font-size:0.85rem;flex:1 1 130px}
        .m-stat b{display:block;font-size:1.05rem;margin-top:4px}
        .m-actions{display:flex;gap:8px;justify-content:center}
      </style>
      <div class="m-wrap">
        <div class="m-tabs">
          <span class="m-tab active" data-tab="med">用药提醒</span>
          <span class="m-tab" data-tab="bp">血压 / 血糖</span>
          <span class="m-tab" data-tab="profile">健康档案</span>
        </div>
        <div class="m-pane active" data-pane="med">
          <div class="m-form">
            <span class="m-field"><label>成员</label><select id="m-member"></select></span>
            <span class="m-field"><label>药品</label><input id="m-name" placeholder="如 降压药" /></span>
            <span class="m-field"><label>用量</label><input id="m-dose" placeholder="如 1 片/次" /></span>
            <span class="m-field"><label>时间</label><input type="time" id="m-time" value="08:00" /></span>
            <button type="button" id="m-add" class="btn btn-primary">添加提醒</button>
          </div>
          <div class="m-list" id="m-med-list"></div>
        </div>
        <div class="m-pane" data-pane="bp">
          <div class="m-form">
            <span class="m-field"><label>类型</label><select id="v-type"><option value="bp">血压</option><option value="glu">血糖</option></select></span>
            <span class="m-field"><label>收缩压 / 血糖值</label><input type="number" id="v-sys" placeholder="如 128 / 5.6" step="0.1" /></span>
            <span class="m-field"><label>舒张压（血糖可不填）</label><input type="number" id="v-dia" placeholder="如 82" /></span>
            <span class="m-field"><label>日期</label><input type="date" id="v-date" /></span>
            <button type="button" id="v-add" class="btn btn-primary">记录</button>
          </div>
          <div class="m-stat">
            <div>最近血压<b id="v-last-bp">—</b></div>
            <div>最近血糖<b id="v-last-glu">—</b></div>
            <div>记录条数<b id="v-count">0</b></div>
          </div>
          <div class="m-list" id="v-list"></div>
        </div>
        <div class="m-pane" data-pane="profile">
          <div class="m-form">
            <span class="m-field"><label>姓名</label><input id="p-name" placeholder="如 奶奶" /></span>
            <span class="m-field"><label>年龄</label><input id="p-age" type="number" placeholder="68" /></span>
            <span class="m-field"><label>血型</label><select id="p-blood"><option>A</option><option>B</option><option>AB</option><option>O</option></select></span>
            <span class="m-field"><label>过敏史</label><input id="p-allergy" placeholder="如 青霉素" /></span>
            <button type="button" id="p-add" class="btn btn-primary">保存成员</button>
          </div>
          <div class="m-list" id="p-list"></div>
        </div>
        <div class="m-actions">
          <button type="button" id="m-sample" class="btn btn-outline">示例数据</button>
          <button type="button" id="m-clear" class="btn btn-outline">清空全部</button>
        </div>
      </div>
    </div>
