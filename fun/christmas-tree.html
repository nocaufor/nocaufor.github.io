  <main class="fun-main">
    <div class="fun-intro">
      <h1 data-i18n="pg_christmas">圣诞树 · 多风格装饰</h1>
      <p>Canvas 圣诞树，三套装饰风格可切换，点亮彩灯与雪花。</p>
    </div>
    <div class="fun-box">
      <div class="stage-center">
        <canvas id="tree-canvas" width="760" height="620" aria-label="圣诞树画布"></canvas>
        <p class="fun-status" id="tree-note">选择装饰风格，点亮你的圣诞树</p>
      </div>
    </div>
    <div class="style-picker" id="tree-picker" aria-label="选择圣诞树装饰风格">
      <button type="button" class="btn is-active" data-style="classic"><span class="theme-demo" style="background:#2f8f5b"></span>经典翠绿</button>
      <button type="button" class="btn" data-style="frost"><span class="theme-demo" style="background:#cfe8f5"></span>雪白冰晶</button>
      <button type="button" class="btn" data-style="gold"><span class="theme-demo" style="background:#e6b84c"></span>金色华彩</button>
    </div>
    <div class="fun-controls">
      <button type="button" id="tree-lights" class="btn btn-primary">点亮彩灯</button>
      <button type="button" id="tree-snow" class="btn btn-outline">下雪</button>
      <button type="button" id="tree-gifts" class="btn btn-outline">放礼物</button>
