  <main class="fun-main">
    <div class="fun-intro">
      <h1>扫雷</h1>
      <p>经典扫雷：左键翻开、右键标旗，数字提示相邻雷数。</p>
    </div>
    <div class="fun-box">
      <style>
        /* 移动端修复：棋盘可横向滚动兜底，375px 下 16×16/30×16 全格可达；9×9 无横滚 */
        .fun-box{width:min(680px,100vw)}
        .ms-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px;width:100%;max-width:100%;overflow-x:auto;min-width:0}
        .ms-panel{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
        .ms-ctrl{display:flex;align-items:center;gap:8px}
        .ms-ctrl select,.ms-ctrl button{font-size:0.85rem}
        .ms-board{display:grid;gap:1px;background:var(--color-border,#333);padding:2px;border-radius:8px;touch-action:pan-x pan-y;--n:9;--cell:38px;grid-template-columns:repeat(var(--n),var(--cell));width:max-content;max-width:none;margin:0 auto}
        .ms-board.wide{margin-right:auto;align-self:flex-start}
        .ms-cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:600;cursor:pointer;user-select:none;border-radius:4px;background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);transition:background .1s}
        .ms-cell:not(.open):hover{background:var(--color-accent,#7aa2f7)}
        .ms-cell.open{background:var(--color-bg,#121216);cursor:default}
        .ms-cell.mine-hit{background:#e06c75;color:#fff}
        .ms-cell .flag{color:#e5c07b;font-size:1rem}
        .ms-cell.c1{color:#7aa2f7}.ms-cell.c2{color:#98c379}.ms-cell.c3{color:#e06c75}.ms-cell.c4{color:#c678dd}.ms-cell.c5{color:#e5c07b}.ms-cell.c6{color:#56b6c2}.ms-cell.c7{color:#d19a66}.ms-cell.c8{color:#abb2bf}
        .ms-status{font-size:0.9rem;min-height:1.2em;text-align:center}
        .ms-help{font-size:0.8rem;opacity:.75;text-align:center;line-height:1.6}
      </style>
      <div class="ms-wrap">
        <div class="ms-panel">
          <span class="ms-ctrl">难度
            <select id="ms-level" aria-label="难度选择">
              <option value="0">初级 9×9</option>
              <option value="1">中级 16×16</option>
              <option value="2">高级 30×16</option>
            </select>
          </span>
          <button type="button" id="ms-new" class="btn btn-primary">新游戏</button>
          <button type="button" id="ms-chord" class="btn btn-outline">双击数字快速展开</button>
        </div>
        <div id="ms-board" class="ms-board" role="grid" aria-label="扫雷棋盘"></div>
        <p id="ms-status" class="ms-status"></p>
        <p class="ms-help">左键翻开 · 右键标旗 · 数字为相邻 8 格雷数 · 双击数字展开周围无雷格</p>
      </div>
    </div>
