    <div class="fun-box">
      <style>
        .j-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:1000px}
        .j-panel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .j-split{display:flex;gap:10px;flex-wrap:wrap}
        .j-area{flex:1 1 300px;min-height:380px;max-height:60vh;border-radius:10px;background:var(--color-card,#1e1e24);padding:12px;font-family:Consolas,Menlo,monospace;font-size:0.85rem;line-height:1.6;color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);resize:vertical;overflow:auto;white-space:pre}

        .j-ok{color:#98c379}

      <div class="j-wrap">
