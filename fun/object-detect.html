<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目标检测 · nocau Fun</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <meta name="description" content="TensorFlow.js COCO-SSD 对上传图片做常见物体检测，标注类别与置信度。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>目标检测</h1>
      <p>基于 TensorFlow.js + COCO-SSD（jsdelivr CDN）的常见物体检测：上传图片，自动标注类别与置信度。</p>
    </div>
    <div class="fun-box">
      <style>
        .od-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:760px}
        .od-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
        .od-canvasbox{width:100%;max-width:720px;min-height:80px;text-align:center}
        .od-canvasbox canvas{max-width:100%;border:1px solid var(--color-border,#28303c);border-radius:12px;background:#0c0f14}
        .od-status{font-size:0.86rem;color:var(--color-muted,#9aa3b2);min-height:1.3em;text-align:center}
        .od-status.od-err{color:#e06c75}
        .od-hint{font-size:0.8rem;color:var(--color-muted,#7c8798);text-align:center}
      </style>
      <div class="od-wrap">
        <div class="od-bar">
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="od-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="od-sample" class="btn btn-outline">使用示例图</button>
          <label class="btn btn-outline" style="cursor:pointer">阈值 <input id="od-threshold" type="range" min="0.3" max="0.9" step="0.05" value="0.5" style="width:120px;vertical-align:middle"></label>
        </div>
        <div class="od-canvasbox"><canvas id="od-canvas" width="720" height="480" aria-label="目标检测结果画布"></canvas></div>
        <p id="od-status" class="od-status">加载 COCO-SSD 模型中，首次需从 CDN 下载权重（约 4~6MB），请稍候…</p>
        <p class="od-hint">识别在浏览器本地进行，图片不上传服务器；离线或 CDN 不可用时将提示加载失败。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="js/fun-common.js"></script>
  <script src="js/object-detect.js"></script>
</body>
</html>
