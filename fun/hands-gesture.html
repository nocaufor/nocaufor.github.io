  <main class="fun-main">
    <div class="fun-intro">
      <h1>手势识别 · MediaPipe Hands</h1>
      <p>开源 <a href="https://github.com/google-ai-edge/mediapipe" target="_blank" rel="noopener">MediaPipe Hands</a> 21 点手部关键点：识别掌/拳/抬指并实时显示手部骨架。模型与 Worker 经 CDN 加载，需要联网；摄像头画面不出本机。</p>
    </div>
    <div class="fun-box">
      <style>
        .hd-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:820px;padding:18px}
        .hd-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .hd-stage{position:relative;width:100%;max-width:680px;background:#05070c;border:1px solid var(--color-border,#28303c);border-radius:14px;overflow:hidden}
        .hd-stage video,#hd-canvas{display:block;width:100%;min-height:200px;max-height:460px;object-fit:cover}
        #hd-canvas{position:absolute;inset:0;width:100%;height:100%}
        .hd-gesture{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(8,10,16,.82);border:1px solid var(--color-border,#28303c);border-radius:20px;padding:6px 16px;font-size:0.95rem;color:var(--color-text,#e8eefb);white-space:nowrap;pointer-events:none}
        .hd-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
        .hd-tip{font-size:0.78rem;color:var(--color-muted,#9aa3b2);text-align:center}
      </style>
      <div class="hd-wrap">
        <div class="hd-bar">
          <button type="button" id="hd-start" class="btn btn-primary">开启手势识别</button>
          <button type="button" id="hd-stop" class="btn btn-outline">停止</button>
        </div>
        <div class="hd-stage">
          <video id="hd-video" playsinline muted></video>
          <canvas id="hd-canvas" aria-label="手部关键点"></canvas>
          <div class="hd-gesture" id="hd-gesture">等待开始…</div>
        </div>
        <p class="hd-status" id="hd-status">MediaPipe 库加载中…</p>
        <p class="hd-tip">需要联网：模型/Worker 来自 cdn.jsdelivr.net；请将手掌完整放入画面并保持光照充足。手势示例：五指张开 = 5 · 比耶 = 2 · 指尖相触 = OK · 握拳 = 0。</p>
