  <main class="fun-main">
    <div class="fun-intro">
      <h1>自动化任务调度器</h1>
      <p>源自想法 C000001：Cron 表达式解析与调度可视化，生成下次执行时间表。</p>
    </div>
    <div class="fun-box">
      <style>
        .cr-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:900px}
        .cr-form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
        .cr-field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:0.8rem}
        .cr-field input{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:7px 10px;font-family:Consolas,Menlo,monospace;font-size:0.85rem;min-width:220px}
        .cr-field input:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .cr-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:0.85rem}
        .cr-timeline{display:flex;flex-direction:column;gap:6px;background:var(--color-card,#1e1e24);border-radius:10px;padding:12px;max-height:260px;overflow:auto;text-align:left;font-size:0.85rem}
        .cr-item{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px}
        .cr-item:nth-child(odd){background:var(--color-bg,#121216)}
        .cr-item .t{font-family:Consolas,Menlo,monospace}
        .cr-item .d{opacity:.75}
        .cr-status{font-size:0.85rem;min-height:1.2em}
        .cr-err{color:#e06c75}
        .cr-hint{font-size:0.78rem;opacity:.7;text-align:center}
        .cr-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
      </style>
      <div class="cr-wrap">
        <div class="cr-form">
          <span class="cr-field"><label>任务名</label><input id="cr-name" value="备份数据库" /></span>
          <span class="cr-field"><label>Cron 表达式（分 时 日 月 周）</label><input id="cr-expr" value="30 2 * * 1-5" spellcheck="false" /></span>
          <button type="button" id="cr-add" class="btn btn-primary">加入调度</button>
        </div>
        <div class="cr-presets">
          <button type="button" class="btn btn-outline" data-preset="0 9 * * *">每天 09:00</button>
          <button type="button" class="btn btn-outline" data-preset="*/5 * * * *">每 5 分钟</button>
          <button type="button" class="btn btn-outline" data-preset="0 0 1 * *">每月 1 号</button>
          <button type="button" class="btn btn-outline" data-preset="0 */2 * * *">每 2 小时</button>
        </div>
        <div class="cr-row">
          <button type="button" id="cr-clear" class="btn btn-outline">清空调度</button>
          <span id="cr-status" class="cr-status"></span>
        </div>
        <div class="cr-timeline" id="cr-list"></div>
        <p class="cr-hint">支持 * ? 数字 / 区间 - 逗号 , 与星期 0-6（0=周日）。仅前端演示调度逻辑，真实执行需接入任务运行器。</p>
      </div>
    </div>
