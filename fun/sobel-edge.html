  <header class="site-header fun-header">

      <a href="../index.html" class="brand">

        <span class="brand-name">NOCAU</span>

          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>

        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>

      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>Sobel 边缘检测</h1>
      <p>先把图片转灰度，再用 3x3 Sobel 卷积求亮度梯度。阈值越高保留的边缘越少；可选 X / Y 单方向梯度。</p>
    </div>
    <div class="fun-box">
      <style>
        .se-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:900px;padding:16px}
        .se-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .se-cvs{width:100%;max-width:760px}
        .se-cvs canvas{display:block;width:100%;height:auto;background:#0a0d12;border:1px solid var(--color-border,#28303c);border-radius:12px}
        .se-ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;align-items:center;font-size:0.85rem;color:var(--color-muted,#9aa3b2)}
        .se-ctrl input[type=range],.se-ctrl select{vertical-align:middle}
        .se-status{font-size:0.8rem;color:var(--color-muted,#9aa3b2);min-height:1.2em;text-align:center}
      </style>
      <div class="se-wrap">
        <div class="se-bar">
          <button type="button" id="se-sample" class="btn btn-outline">示例图</button>
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="se-file" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="se-cvs"><canvas id="se-canvas" width="720" height="500" aria-label="边缘检测画布"></canvas></div>
        <div class="se-ctrl">
          <label>阈值 <input id="se-thr" type="range" min="6" max="180" value="46" /></label>
          <label>梯度方向
            <select id="se-mode">
              <option value="mag" selected>模长（全部边缘）</option>
              <option value="dx">水平方向（X）</option>
              <option value="dy">垂直方向（Y）</option>
            </select>
          </label>
        </div>
        <p class="se-status" id="se-status"></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
