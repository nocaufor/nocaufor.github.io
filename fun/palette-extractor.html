        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">

      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>图片取色 / 调色板</h1>
      <p>从图片提取主色：K 均值聚类得到 6 个代表色；点击画面任意像素可取色。色值支持一键复制（HEX / RGB）。</p>
    </div>
    <div class="fun-box">
      <style>
        .pl-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:880px;padding:18px}
        .pl-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .pl-stage{position:relative;width:100%;max-width:720px;overflow:hidden;border:1px solid var(--color-border,#28303c);border-radius:12px;cursor:crosshair}
        #pl-canvas{display:block;width:100%;height:auto;background:#0d1117}
        .pl-tip{position:absolute;display:none;pointer-events:none;font-size:0.78rem;background:rgba(8,10,16,.92);border:1px solid var(--color-border,#28303c);border-radius:8px;padding:4px 8px;color:var(--color-text,#e8eefb)}
        .pl-swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:100%;max-width:720px}
        .pl-swatch{border-radius:10px;overflow:hidden;border:1px solid var(--color-border,#28303c);min-height:64px;cursor:pointer;transition:transform .12s}
        .pl-swatch:hover{transform:translateY(-2px)}
        .pl-swatch .fill{height:44px}
        .pl-swatch .meta{padding:4px 8px;font-size:0.76rem;color:var(--color-muted,#9aa3b2);background:#0d1117;word-break:break-all}
        .pl-pick{font-size:0.84rem;min-height:1.6em;color:var(--color-muted,#9aa3b2)}
      </style>
      <div class="pl-wrap">
        <div class="pl-bar">
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="pl-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="pl-sample" class="btn btn-outline">示例渐变图</button>
        </div>
        <div class="pl-stage" id="pl-stage">
          <canvas id="pl-canvas" width="720" height="420" aria-label="取色图片"></canvas>
          <div class="pl-tip" id="pl-tip"></div>
        </div>
        <div class="pl-swatches" id="pl-swatches"></div>
        <p class="pl-pick" id="pl-pick">点击画面取色；点击色块复制该颜色。</p>
        <p id="pl-status" style="font-size:0.8rem;color:var(--color-muted,#9aa3b2)">算法为 K 均值聚类 + 透明底合成，全部本地运行。</p>
      </div>
    </div>
