  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <meta name="description" content="用视觉模拟矩阵把颜色映射为红绿色盲 / 蓝黄色盲所见效果，原图与模拟结果并排对比，支持示例图与本地图片。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>色盲视觉模拟</h1>
      <p>用标准视觉模拟矩阵把 RGB 映射为对应色觉缺陷所见。强度 0 为原图、100 为完全模拟；示例图含常用红绿配色。</p>
    </div>
    <div class="fun-box">
      <style>
        .cb-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:920px;padding:16px}
        .cb-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .cb-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:840px}
        .cb-panel{display:flex;flex-direction:column;gap:6px;text-align:center}
        .cb-panel canvas{display:block;width:100%;height:auto;background:#0a0d12;border:1px solid var(--color-border,#28303c);border-radius:10px}
        .cb-label{font-size:0.8rem;color:var(--color-muted,#9aa3b2)}
        .cb-ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;align-items:center;font-size:0.85rem;color:var(--color-muted,#9aa3b2)}
        .cb-ctrl select{vertical-align:middle}
        .cb-status{font-size:0.8rem;color:var(--color-muted,#9aa3b2);min-height:1.2em;text-align:center}
        @media (max-width:560px){.cb-cols{grid-template-columns:1fr}}
      </style>
      <div class="cb-wrap">
        <div class="cb-bar">
          <button type="button" id="cb-sample" class="btn btn-outline">示例图</button>
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="cb-file" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="cb-cols">
          <div class="cb-panel">
            <canvas id="cb-orig" width="420" height="290" aria-label="原图"></canvas>
            <span class="cb-label">原图</span>
          </div>
          <div class="cb-panel">
            <canvas id="cb-sim" width="420" height="290" aria-label="模拟效果"></canvas>
            <span class="cb-label" id="cb-simlabel">模拟效果</span>
          </div>
        </div>
        <div class="cb-ctrl">
          <label>类型
            <select id="cb-type">
              <option value="deutan" selected>红色盲 / 绿色盲（Deutan）</option>
              <option value="protan">红色盲（Protan）</option>
              <option value="tritan">蓝黄色盲（Tritan）</option>
            </select>
          </label>
          <label>模拟强度 <input id="cb-strength" type="range" min="0" max="100" value="100" /></label>
        </div>
        <p class="cb-status" id="cb-status"></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/colorblind-sim.js"></script>
</body>
</html>
