  <main class="fun-main">
    <div class="fun-intro">
      <h1>极简团队任务看板</h1>
      <p>源自想法 B000015：待办/进行中/已完成三列看板，拖拽移动卡片，适配 3-10 人小团队。</p>
    </div>
    <div class="fun-box">
      <style>
        .k-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:1020px}
        .k-add{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .k-add input{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:8px 12px;font-size:0.85rem;flex:1 1 260px}
        .k-add input:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .k-add select{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:8px 10px}
        .k-board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
        .k-col{background:var(--color-card,#1e1e24);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
        .k-col h2{font-size:0.95rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .k-col h2 .cnt{font-size:0.75rem;opacity:.7}
        .k-card{background:var(--color-bg,#121216);border:1px solid var(--color-border,#333);border-radius:8px;padding:8px 10px;font-size:0.85rem;cursor:grab;display:flex;justify-content:space-between;gap:6px;align-items:center;user-select:none}
        .k-card.dragging{opacity:.4}
        .k-card .owner{font-size:0.72rem;opacity:.7;white-space:nowrap}
        .k-card .del{cursor:pointer;opacity:.5;font-size:0.9rem;padding:0 2px}
        .k-card .del:hover{opacity:1;color:#e06c75}
        .k-col.hover{border:1px dashed var(--color-accent,#7aa2f7)}
        .k-hint{font-size:0.8rem;opacity:.75;text-align:center}
      </style>
      <div class="k-wrap">
        <div class="k-add">
          <input id="k-title" placeholder="输入任务内容…" aria-label="任务内容" />
          <input id="k-owner" placeholder="负责人（可选）" aria-label="负责人" style="flex:0 1 150px" />
          <button type="button" id="k-add" class="btn btn-primary">添加任务</button>
          <button type="button" id="k-clear" class="btn btn-outline">清空全部</button>
        </div>
        <div class="k-board">
          <div class="k-col" data-status="todo"><h2>待办 <span class="cnt" data-cnt="todo"></span></h2><div class="k-list" data-list="todo"></div></div>
          <div class="k-col" data-status="doing"><h2>进行中 <span class="cnt" data-cnt="doing"></span></h2><div class="k-list" data-list="doing"></div></div>
          <div class="k-col" data-status="done"><h2>已完成 <span class="cnt" data-cnt="done"></span></h2><div class="k-list" data-list="done"></div></div>
        </div>
        <p class="k-hint">拖拽卡片切换状态 · 数据保存在浏览器 localStorage</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
