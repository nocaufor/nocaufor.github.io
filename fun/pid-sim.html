    <div class="fun-intro">
      <h1>PID 闭环控制器仿真</h1>
      <p>源自想法 C000004：比例-积分-微分控制的阶跃响应可视化仿真，调参观察收敛曲线。</p>
    </div>
    <div class="fun-box">
      <style>
        .pd-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:960px}
        .pd-canvas{display:block;background:#0e0e12;border-radius:12px;max-width:100%}
        .pd-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:0.85rem}
        .pd-controls label{display:flex;align-items:center;gap:6px}
        .pd-controls input{width:72px;background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:6px;padding:4px 8px;font-family:Consolas,Menlo,monospace}
        .pd-status{font-size:0.85rem;min-height:1.2em;text-align:center}
        .pd-hint{font-size:0.78rem;opacity:.7;text-align:center}
        .pd-preset{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
      </style>
      <div class="pd-wrap">
        <canvas id="pd-canvas" class="pd-canvas" width="880" height="360" aria-label="PID 仿真曲线"></canvas>
        <div class="pd-controls">
          <label>Kp <input id="pd-kp" type="number" step="0.1" value="1.0" /></label>
          <label>Ki <input id="pd-ki" type="number" step="0.01" value="0.2" /></label>
          <label>Kd <input id="pd-kd" type="number" step="0.01" value="0.4" /></label>
          <label>目标 <input id="pd-target" type="number" step="0.5" value="60" /></label>
          <button type="button" id="pd-run" class="btn btn-primary">运行 / 暂停</button>
          <button type="button" id="pd-reset" class="btn btn-outline">复位</button>
        </div>
        <div class="pd-preset">
          <button type="button" class="btn btn-outline" data-preset="P">纯 P</button>
          <button type="button" class="btn btn-outline" data-preset="PI">PI</button>
          <button type="button" class="btn btn-outline" data-preset="PID">PID 推荐</button>
          <button type="button" class="btn btn-outline" data-preset="aggr">激进</button>
        </div>
        <p id="pd-status" class="pd-status"></p>
        <p class="pd-hint">一阶惯性对象仿真：Kp 决定响应速度，Ki 消除稳态误差，Kd 抑制超调。绿色为设定值，蓝色为输出。</p>
      </div>
