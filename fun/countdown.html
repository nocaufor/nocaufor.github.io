        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>

  <main class="fun-main">
    <div class="fun-intro">
      <h1>倒计时</h1>
      <p>设定目标日期，实时计算剩余天时分秒。</p>
    </div>
        <div class="fun-box">
          <div class="stage-center">
            <p class="fun-status" id="countdown-label">距离 目标日 还有</p>
            <div class="countdown-grid">
              <div class="countdown-cell"><span class="num" id="cd-days">0</span><span class="unit">天</span></div>
              <div class="countdown-cell"><span class="num" id="cd-hours">0</span><span class="unit">时</span></div>
              <div class="countdown-cell"><span class="num" id="cd-mins">0</span><span class="unit">分</span></div>
              <div class="countdown-cell"><span class="num" id="cd-secs">0</span><span class="unit">秒</span></div>
            </div>
          </div>
        </div>
        <div class="wish-input">
          <input type="date" id="countdown-date" class="form-control" />
          <button type="button" id="countdown-start" class="btn btn-primary">开始倒计时</button>
        </div>
    <div class="fun-footer">
