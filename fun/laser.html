  <main class="fun-main">
    <div class="fun-intro">
      <h1>激光光束与折射</h1>
      <p>激光束动态演示：调节入射方向与两面反射镜角度，观察光路反射、交点与能量集中点。</p>
    </div>
    <div class="fun-box">
      <style>
        .lz-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:860px}
        .lz-stage{width:100%;max-width:820px}
        .lz-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:14px}
        .lz-controls{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
        .lz-ctl{display:flex;flex-direction:column;gap:3px;font-size:0.82rem;color:var(--color-muted,#9aa3b2);min-width:170px}
        .lz-status{font-size:0.86rem;color:var(--color-text,#e8e8ea);min-height:1.3em}
      </style>
      <div class="lz-wrap">
        <div class="lz-stage"><canvas id="lz-canvas" width="820" height="420" aria-label="激光束光路动画"></canvas></div>
        <div class="lz-controls">
          <label class="lz-ctl">入射角（度）<input id="lz-angle" type="range" min="-30" max="30" step="1" value="0"></label>
          <label class="lz-ctl">镜 A 角度（度）<input id="lz-mirrorA" type="range" min="10" max="80" step="1" value="45"></label>
          <label class="lz-ctl">镜 B 角度（度）<input id="lz-mirrorB" type="range" min="100" max="170" step="1" value="135"></label>
        </div>
        <p class="lz-status" id="lz-status">拖动滑块改变入射角与镜面角度。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
