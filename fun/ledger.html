  <main class="fun-main">
    <div class="fun-intro">
      <h1>个人记账与预算洞察</h1>
      <p>源自想法 B000008：本地优先记账，收支分类、月度统计与预算趋势，数据存于浏览器。</p>
    </div>
    <div class="fun-box">
      <style>
        .l-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:980px}
        .l-panel{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
        .l-field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:0.8rem}
        .l-field input,.l-field select{background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:8px;padding:7px 10px;font-size:0.85rem}
        .l-field input:focus,.l-field select:focus{outline:none;border-color:var(--color-accent,#7aa2f7)}
        .l-summary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .l-sum{flex:1 1 130px;background:var(--color-card,#1e1e24);border-radius:10px;padding:10px;text-align:center}
        .l-sum b{display:block;font-size:1.1rem;margin-top:4px}
        .l-sum.income b{color:#98c379}.l-sum.expense b{color:#e06c75}.l-sum.balance b{color:#7aa2f7}
        .l-table{width:100%;border-collapse:collapse;font-size:0.85rem}
        .l-table th,.l-table td{border-bottom:1px solid var(--color-border,#333);padding:7px 8px;text-align:left}
        .l-table th{opacity:.7;font-weight:600}
        .l-budget{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:0.85rem}
        .l-bar{flex:1 1 220px;height:8px;background:var(--color-border,#333);border-radius:999px;overflow:hidden}
        .l-bar i{display:block;height:100%;background:var(--color-accent,#7aa2f7);border-radius:999px}
        .l-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
      </style>
      <div class="l-wrap">
        <div class="l-panel">
          <span class="l-field"><label for="l-date">日期</label><input type="date" id="l-date" /></span>
          <span class="l-field"><label for="l-type">类型</label><select id="l-type"><option value="expense">支出</option><option value="income">收入</option></select></span>
          <span class="l-field"><label for="l-cat">分类</label><select id="l-cat"></select></span>
          <span class="l-field"><label for="l-amount">金额</label><input type="number" id="l-amount" min="0" step="0.01" placeholder="0.00" /></span>
          <span class="l-field"><label for="l-note">备注</label><input id="l-note" placeholder="可选" /></span>
          <button type="button" id="l-add" class="btn btn-primary">记一笔</button>
        </div>
        <div class="l-summary">
          <div class="l-sum income">本月收入<b id="l-inc">0.00</b></div>
          <div class="l-sum expense">本月支出<b id="l-exp">0.00</b></div>
          <div class="l-sum balance">结余<b id="l-bal">0.00</b></div>
        </div>
        <div class="l-budget">
          <label>月度预算 <input id="l-budget" type="number" value="3000" min="0" style="width:80px;background:var(--color-card,#1e1e24);color:inherit;border:1px solid var(--color-border,#333);border-radius:6px;padding:4px 8px" /> 元</label>
          <span class="l-bar"><i id="l-bar"></i></span>
          <span id="l-budget-txt"></span>
        </div>
        <table class="l-table">
          <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th></th></tr></thead>
          <tbody id="l-body"></tbody>
        </table>
        <div class="l-actions">
          <button type="button" id="l-sample" class="btn btn-outline">示例数据</button>
          <button type="button" id="l-clear" class="btn btn-outline">清空记录</button>
        </div>
      </div>
    </div>
