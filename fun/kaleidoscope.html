<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>万花筒 · nocau Fun</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <meta name="description" content="按径向对称份数切分、镜像并拼合画面，生成万花筒图案。份数可调，支持示例图与本地图片，纯本地 Canvas 像素处理。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>万花筒</h1>
      <p>把源图按角度切进一个对称扇区，再沿圆周镜像拼贴。份数越多图案越细密，换不同示例图或上传照片效果差别很大。</p>
    </div>
    <div class="fun-box">
      <style>
        .kl-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:860px;padding:16px}
        .kl-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .kl-cvs{width:100%;max-width:560px}
        .kl-cvs canvas{display:block;width:100%;height:auto;background:#0a0d12;border:1px solid var(--color-border,#28303c);border-radius:50%}
        .kl-ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;align-items:center;font-size:0.85rem;color:var(--color-muted,#9aa3b2)}
        .kl-status{font-size:0.8rem;color:var(--color-muted,#9aa3b2);min-height:1.2em;text-align:center}
      </style>
      <div class="kl-wrap">
        <div class="kl-bar">
          <button type="button" id="kl-sample" class="btn btn-outline">示例图</button>
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="kl-file" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="kl-cvs"><canvas id="kl-canvas" width="640" height="640" aria-label="万花筒画布"></canvas></div>
        <div class="kl-ctrl">
          <label>对称份数 <input id="kl-n" type="range" min="3" max="24" value="8" /></label>
          <span>当前 <b id="kl-num">8</b> 份</span>
        </div>
        <p class="kl-status" id="kl-status"></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/kaleidoscope.js"></script>
</body>
</html>
