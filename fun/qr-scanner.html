  <link rel="stylesheet" href="fun.css" />

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>二维码扫码 · jsQR</h1>
      <p>开源 <a href="https://github.com/cozmo/jsQR" target="_blank" rel="noopener">jsQR</a> 纯前端解码：摄像头实时扫或上传图片，数据不出本机。库来自 CDN，离线时按钮会给出提示。</p>
    </div>
    <div class="fun-box">
      <style>
        .qr-wrap{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%;max-width:760px;padding:18px}
        .qr-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .qr-stage{position:relative;width:100%;max-width:680px}
        .qr-stage canvas,#qr-video{width:100%;height:auto;display:block;background:#05070c;border:1px solid var(--color-border,#28303c);border-radius:14px}
        .qr-stage video{object-fit:cover;min-height:220px}
        .qr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--color-muted,#9aa3b2);font-size:0.9rem}
        .qr-result{min-height:2.4em;max-width:680px;word-break:break-all;text-align:center;font-size:0.9rem;color:var(--color-brand,#7aa2f7);font-family:"SF Mono",Consolas,monospace}
        .qr-tip{font-size:0.78rem;color:var(--color-muted,#9aa3b2)}
        .qr-tip a{color:var(--color-brand,#7aa2f7)}
      </style>
      <div class="qr-wrap">
        <div class="qr-bar">
          <button type="button" id="qr-cam" class="btn btn-primary">开启摄像头扫码</button>
          <label class="btn btn-outline" style="cursor:pointer">上传二维码图片
            <input id="qr-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="qr-sample" class="btn btn-outline">生成示例二维码</button>
        </div>
        <div class="qr-stage">
          <canvas id="qr-canvas" width="640" height="360" aria-label="二维码预览"></canvas>
          <video id="qr-video" playsinline muted hidden></video>
        </div>
        <p class="qr-result" id="qr-status">加载 jsQR 库中…</p>
        <p class="qr-tip">依赖开源库：<a href="https://github.com/cozmo/jsQR" target="_blank" rel="noopener">jsQR</a> 与 <a href="https://github.com/soldair/node-qrcode" target="_blank" rel="noopener">qrcode</a>（生成示例用），需能访问 cdn.jsdelivr.net（两个开源库静态资源均在此托管）；摄像头需在 https 或 localhost 下使用。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>

        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/fun-common.js"></script>
  <script src="js/qr-scanner.js"></script>
</body>
</html>
