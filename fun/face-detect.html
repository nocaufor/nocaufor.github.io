  <main class="fun-main">
    <div class="fun-intro">
      <h1>人脸识别</h1>
      <p>基于 face-api.js（jsdelivr CDN）的纯前端人脸检测：上传图片即自动识别并画框，模型在浏览器本地运行。</p>
    </div>
    <div class="fun-box">
      <style>
        .fd-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:760px}
        .fd-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
        .fd-canvasbox{width:100%;max-width:720px;min-height:80px;text-align:center}
        .fd-canvasbox canvas{max-width:100%;border:1px solid var(--color-border,#28303c);border-radius:12px;background:#0c0f14}
        .fd-status{font-size:0.86rem;color:var(--color-muted,#9aa3b2);min-height:1.3em;text-align:center}
        .fd-status.fd-err{color:#e06c75}
        .fd-hint{font-size:0.8rem;color:var(--color-muted,#7c8798);text-align:center}
      </style>
      <div class="fd-wrap">
        <div class="fd-bar">
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="fd-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="fd-sample" class="btn btn-outline">使用示例图</button>
        </div>
        <div class="fd-canvasbox"><canvas id="fd-canvas" width="720" height="480" aria-label="人脸检测结果画布"></canvas></div>
        <p id="fd-status" class="fd-status">加载轻量模型（tiny face detector）中，首次需从 CDN 下载约 200KB…</p>
        <p class="fd-hint">图片仅在本地浏览器处理，不会上传到任何服务器；离线或 CDN 不可用时将提示加载失败。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
