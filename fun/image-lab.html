  <meta charset="UTF-8" />

  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <meta name="description" content="Sobel 边缘检测、素描风等图像处理实验的对照演示与参数调节。" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="fun.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" />
</head>
<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>图像处理实验</h1>
      <p>对照实验台：Sobel 边缘、素描风、浮雕等算法叠加演示，调节阈值观察像素级处理效果。</p>
    </div>
    <div class="fun-box">
      <style>
        .il-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:1060px}
        .il-split{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
        .il-panel{flex:1 1 420px;min-width:0;text-align:center}
        .il-panel p{font-size:0.82rem;color:var(--color-muted,#9aa3b2);margin:4px 0}
        .il-panel canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:12px}
        .il-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .il-bar .btn{min-width:88px}
        .il-opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .il-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
      </style>
      <div class="il-wrap">
        <div class="il-bar">
          <button type="button" class="btn btn-outline" data-mode="原图">原图</button>
          <button type="button" class="btn btn-outline" data-mode="sobel">Sobel 边缘</button>
          <button type="button" class="btn btn-outline" data-mode="sketch">素描风</button>
          <button type="button" class="btn btn-outline" data-mode="emboss">浮雕</button>
          <label class="btn btn-outline" style="cursor:pointer">选图
            <input id="il-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="il-sample" class="btn btn-primary">重新生成示例图</button>
        </div>
        <div class="il-opts">
          <label>阈值/强度 <input id="il-threshold" type="range" min="0" max="1" step="0.02" value="0.35"></label>
        </div>
        <div class="il-split">
          <div class="il-panel"><p>原图</p><canvas id="il-orig" width="520" height="340" aria-label="原图画布"></canvas></div>
          <div class="il-panel"><p id="il-out-label">处理后</p><canvas id="il-out" width="520" height="340" aria-label="处理结果画布"></canvas></div>
        </div>
        <p class="il-status" id="il-status">示例图为本地绘制，也可上传自己的图片进行实验。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/image-lab.js"></script>
</body>
</html>
