<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>图像滤镜</h1>
      <p>Canvas 像素级滤镜实验：灰度 / 反色 / 锐化 / 模糊 / 边缘检测，全部为本地算法，图片不上传。</p>
    </div>
    <div class="fun-box">
      <style>
        .if-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:820px}
        .if-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .if-bar .btn{min-width:78px}
        .if-stage{width:100%;max-width:780px}
        .if-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:12px}
        .if-opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .if-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
      </style>
      <div class="if-wrap">
        <div class="if-bar">
          <button type="button" class="btn btn-outline" data-filter="原图">原图</button>
          <button type="button" class="btn btn-outline" data-filter="灰度">灰度</button>
          <button type="button" class="btn btn-outline" data-filter="反色">反色</button>
          <button type="button" class="btn btn-outline" data-filter="锐化">锐化</button>
          <button type="button" class="btn btn-outline" data-filter="模糊">模糊</button>
          <button type="button" class="btn btn-outline" data-filter="边缘">边缘检测</button>
          <label class="btn btn-outline" style="cursor:pointer">选图
            <input id="if-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="if-sample" class="btn btn-primary">重新生成示例图</button>
        </div>
        <div class="if-stage"><canvas id="if-canvas" width="780" height="520" aria-label="滤镜结果画布"></canvas></div>
        <div class="if-opts">
          <label>强度 <input id="if-strength" type="range" min="0" max="1" step="0.05" value="0.6"></label>
          <span id="if-name">当前：原图</span>
        </div>
        <p class="if-status" id="if-status">可点击“选图”上传自己的图片；示例图为本地程序绘制。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>

        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>

  <script src="js/image-filter.js"></script>
</body>
</html>
