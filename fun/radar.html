  <meta charset="UTF-8" />

  <link rel="stylesheet" href="fun.css" />

<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>雷达扫描</h1>
      <p>Canvas 雷达扫描：旋转扫描线、目标亮点回波、距离与角度读数，速度与目标数可调。</p>
    </div>
    <div class="fun-box">
      <style>
        .rd-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:640px}
        .rd-stage{position:relative;width:min(92vw,520px)}
        .rd-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#12151c);border:1px solid var(--color-border,#28303c);border-radius:14px}
        .rd-controls{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%}
        .rd-ctl{display:flex;flex-direction:column;gap:4px;font-size:0.82rem;color:var(--color-muted,#9aa3b2)}
        .rd-ctl input{width:150px}
        .rd-readout{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:0.85rem;min-height:1.4em}
        .rd-tag{background:rgba(122,162,247,.12);border:1px solid rgba(122,162,247,.28);color:#9fc0ff;border-radius:8px;padding:3px 9px}
      </style>
      <div class="rd-wrap">
        <div class="rd-stage"><canvas id="rd-canvas" width="520" height="520" aria-label="雷达扫描动画"></canvas></div>
        <div class="rd-controls">
          <label class="rd-ctl">扫描速度 <input id="rd-speed" type="range" min="0.3" max="4" step="0.1" value="1.4"></label>
          <label class="rd-ctl">目标数量 <input id="rd-count" type="range" min="1" max="15" step="1" value="6"></label>
        </div>
        <p class="rd-readout"><span class="rd-tag" id="rd-angle">扫描角 0°</span><span class="rd-tag" id="rd-contact">最近目标 无</span></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">
        <img class="mini-logo" src="../assets/img/logo.svg" alt="nocau" width="16" height="16" />
        © <span id="year">2026</span> nocau.com
      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/radar.js"></script>

</html>
