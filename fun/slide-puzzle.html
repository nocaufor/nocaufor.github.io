  <main class="fun-main">
    <div class="fun-intro">
      <h1>滑块拼图</h1>
      <p>3×3 滑块拼图：点击相邻方块移动，还原数字顺序。</p>
    </div>
    <div class="fun-box">
      <style>
        .p-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
        .p-panel{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
        .p-board{display:grid;grid-template-columns:repeat(3,86px);gap:4px;background:var(--color-border,#333);padding:4px;border-radius:12px;touch-action:manipulation}
        .p-tile{width:86px;height:86px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;border-radius:8px;background:var(--color-accent,#7aa2f7);color:#fff;cursor:pointer;user-select:none;transition:background .1s}
        .p-tile.empty{background:transparent;cursor:default}
        .p-tile:not(.empty):hover{background:#5d8ee6}
        .p-status{font-size:0.9rem;min-height:1.2em}
        .p-hint{font-size:0.8rem;opacity:.75;text-align:center}
      </style>
      <div class="p-wrap">
        <div class="p-panel">
          <button type="button" id="p-shuffle" class="btn btn-primary">打乱</button>
          <span class="p-status" id="p-status">点击打乱开始</span>
        </div>
        <div id="p-board" class="p-board" role="grid" aria-label="滑块拼图棋盘"></div>
        <p class="p-hint">点击与空白相邻的方块即可滑动 · 目标：1-8 顺序还原</p>
      </div>
    </div>
