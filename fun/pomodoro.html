  <main class="fun-main">
    <div class="fun-intro">
      <h1>Pomodoro 计时器</h1>
      <p>番茄工作法：专注 25 分钟 + 休息 5 分钟，自动循环并记录轮次。</p>
    </div>
    <div class="fun-box">
      <style>
        .pm-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
        .pm-ring{position:relative;width:230px;height:230px}
        .pm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
        .pm-bg,.pm-fg{fill:none;stroke-width:10}
        .pm-bg{stroke:var(--color-border,#333)}
        .pm-fg{stroke:var(--color-accent,#7aa2f7);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
        .pm-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
        .pm-clock{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
        .pm-mode{font-size:0.9rem;opacity:.8}
        .pm-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .pm-cfg{display:flex;gap:14px;font-size:0.85rem;align-items:center;flex-wrap:wrap;justify-content:center}
        .pm-cfg input{width:56px;background:var(--color-card,#1e1e24);color:var(--color-text,#e8e8ea);border:1px solid var(--color-border,#333);border-radius:6px;padding:4px 8px;font-size:0.85rem}
        .pm-stat{font-size:0.85rem;opacity:.85;min-height:1.3em}
      </style>
      <div class="pm-wrap">
        <div class="pm-ring">
          <svg viewBox="0 0 230 230" aria-hidden="true">
            <circle class="pm-bg" cx="115" cy="115" r="100"></circle>
            <circle class="pm-fg" id="pm-fg" cx="115" cy="115" r="100"></circle>
          </svg>
          <div class="pm-time">
            <span class="pm-clock" id="pm-clock">25:00</span>
            <span class="pm-mode" id="pm-mode">专注</span>
          </div>
        </div>
        <div class="pm-controls">
          <button type="button" id="pm-start" class="btn btn-primary">开始</button>
          <button type="button" id="pm-reset" class="btn btn-outline">重置</button>
          <button type="button" id="pm-skip" class="btn btn-outline">跳过</button>
        </div>
        <div class="pm-cfg">
          <label>专注 <input type="number" id="pm-focus" value="25" min="1" max="120" /> 分钟</label>
          <label>休息 <input type="number" id="pm-break" value="5" min="1" max="60" /> 分钟</label>
        </div>
        <p class="pm-stat" id="pm-stat">本轮第 1 个专注 · 今日完成 0 轮</p>
      </div>
    </div>
