  <main class="fun-main">
    <div class="fun-intro">
      <h1>铅笔素描</h1>
      <p>灰度反色后做高斯近似模糊，再用颜色减淡混合得到铅笔线稿。强度越高，笔迹越深越明显。</p>
    </div>
    <div class="fun-box">
      <style>
        .ps-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:900px;padding:16px}
        .ps-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .ps-cvs{width:100%;max-width:760px}
        .ps-cvs canvas{display:block;width:100%;height:auto;background:#f4f1ea;border:1px solid var(--color-border,#28303c);border-radius:12px}
        .ps-ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:center;align-items:center;font-size:0.85rem;color:var(--color-muted,#9aa3b2)}
        .ps-status{font-size:0.8rem;color:var(--color-muted,#9aa3b2);min-height:1.2em;text-align:center}
      </style>
      <div class="ps-wrap">
        <div class="ps-bar">
          <button type="button" id="ps-sample" class="btn btn-outline">示例图</button>
          <label class="btn btn-primary" style="cursor:pointer">选择图片
            <input id="ps-file" type="file" accept="image/*" hidden />
          </label>
        </div>
        <div class="ps-cvs"><canvas id="ps-canvas" width="720" height="500" aria-label="铅笔素描画布"></canvas></div>
        <div class="ps-ctrl">
          <label>笔触强度 <input id="ps-strength" type="range" min="5" max="100" value="75" /></label>
          <span>模糊半径 <b id="ps-radius-text">3 px</b></span>
          <input id="ps-radius" type="range" min="1" max="9" value="3" hidden />
        </div>
        <p class="ps-status" id="ps-status"></p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
