          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>

      </div>
    </div>

  <main class="fun-main">
    <div class="fun-intro">
      <h1>爱心祝福</h1>
      <p>跳动的爱心由粒子组成，随节奏缩放，治愈系。</p>
    </div>
        <div class="fun-box">
          <div class="fun-canvas-wrap">
            <canvas id="heart-canvas" aria-label="跳动爱心画布"></canvas>
            <span class="click-hint">点击画布重新生成</span>
          </div>
        </div>
        <div class="style-picker" id="heart-picker" aria-label="选择爱心形态">
          <button type="button" class="btn is-active" data-style="classic"><span class="theme-demo" style="background:#e07b54"></span>经典粒子</button>
          <button type="button" class="btn" data-style="star"><span class="theme-demo" style="background:#a3779e"></span>星芒闪耀</button>
          <button type="button" class="btn" data-style="flow"><span class="theme-demo" style="background:#e3b341"></span>流光圆点</button>
        </div>
        <div class="fun-controls">
          <button type="button" id="heart-faster" class="btn btn-outline">快一点</button>
          <button type="button" id="heart-slower" class="btn btn-outline">慢一点</button>
        </div>
        <p id="heart-status" class="fun-status"></p>
    <div class="fun-footer">
