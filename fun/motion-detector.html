<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>

        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>摄像头运动检测</h1>
      <p>帧差法识别画面中的运动区域并框出，灵敏度与最小面积可调；无摄像头时点“演示模式”用程序绘制移动色块运行。视频流只在浏览器本地处理。</p>
    </div>
    <div class="fun-box">
      <style>
        .md-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:780px;padding:18px}
        .md-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .md-stage{position:relative;width:100%;max-width:680px}
        #md-canvas{width:100%;height:auto;display:block;background:#05070c;border:1px solid var(--color-border,#28303c);border-radius:14px}
        .md-opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .md-opts input[type=range]{width:120px}
        .md-opts input[type=checkbox]{accent-color:#7aa2f7}
        .md-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
      </style>
      <div class="md-wrap">
        <div class="md-bar">
          <button type="button" id="md-cam" class="btn btn-primary">开启摄像头检测</button>
          <button type="button" id="md-demo" class="btn btn-outline">演示模式（无需摄像头）</button>
          <button type="button" id="md-stop" class="btn btn-outline">停止</button>
        </div>
        <div class="md-stage"><canvas id="md-canvas" width="640" height="360" aria-label="运动检测画面"></canvas></div>
        <div class="md-opts">
          <label>灵敏度 <input id="md-sens" type="range" min="4" max="60" step="1" value="26"></label>
          <label>最小面积 <input id="md-area" type="range" min="0.002" max="0.05" step="0.001" value="0.012"></label>
          <label><input id="md-box" type="checkbox" checked> 画框</label>
          <span id="md-cnt">运动区域：0</span>
        </div>
        <p class="md-status" id="md-status">点击“开启摄像头检测”或“演示模式”。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>

      </nav>
    </div>
  </footer>

  <script src="js/motion-detector.js"></script>
</body>
