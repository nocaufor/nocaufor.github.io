<body class="fun-page">
  <header class="site-header fun-header">
    <div class="container nav">
      <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/img/logo.svg" alt="nocau" width="30" height="30" />
        <span class="brand-name">NOCAU</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" id="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">代码开发合集</a>
          <a href="../star-db.html">星空数据库</a>
          <a href="../contact.html">联系</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深浅色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="fun-main">
    <div class="fun-intro">
      <h1>卡通 / 水彩风格滤镜</h1>
      <p>用“双边量化 + 边缘描线”把照片转成扁平卡通，另含水彩（低饱和柔化）变体。算法为本地像素处理，图片不上传。</p>
    </div>
    <div class="fun-box">
      <style>
        .cf-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:860px;padding:18px}
        .cf-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
        .cf-stage{width:100%;max-width:760px}
        .cf-stage canvas{width:100%;height:auto;display:block;background:var(--color-card,#0d1117);border:1px solid var(--color-border,#28303c);border-radius:12px}
        .cf-opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;font-size:0.84rem;color:var(--color-muted,#9aa3b2)}
        .cf-opts input[type=range]{width:130px}
        .cf-status{font-size:0.84rem;min-height:1.3em;text-align:center;color:var(--color-muted,#9aa3b2)}
      </style>
      <div class="cf-wrap">
        <div class="cf-bar">
          <button type="button" class="btn btn-outline" data-mode="orig">原图</button>
          <button type="button" class="btn btn-primary" data-mode="cartoon">卡通</button>
          <button type="button" class="btn btn-outline" data-mode="water">水彩</button>
          <label class="btn btn-outline" style="cursor:pointer">选图
            <input id="cf-file" type="file" accept="image/*" hidden />
          </label>
          <button type="button" id="cf-sample" class="btn btn-outline">示例图</button>
        </div>
        <div class="cf-stage"><canvas id="cf-canvas" width="680" height="420" aria-label="滤镜结果"></canvas></div>
        <div class="cf-opts">
          <label>色彩层数 <input id="cf-level" type="range" min="3" max="9" step="1" value="6"></label>
          <label>边缘强度 <input id="cf-edge" type="range" min="0" max="2" step="0.1" value="0.9"></label>
          <span id="cf-name">当前：原图</span>
        </div>
        <p class="cf-status" id="cf-status">上传图片或点“示例图”；参数变更后自动重算。</p>
      </div>
    </div>
    <div class="fun-footer">
      <a href="index.html" class="btn btn-outline">← 返回代码开发合集</a>
    </div>
  </main>
  <footer class="site-footer">

      </span>
      <nav class="footer-links">
        <a href="index.html">代码开发合集</a>
        <a href="../index.html">首页</a>
      </nav>
    </div>
  </footer>
  <script src="js/fun-common.js"></script>
  <script src="js/cartoon-filter.js"></script>
</body>
</html>
