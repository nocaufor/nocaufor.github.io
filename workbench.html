<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<style>
  /* 沿用站点 style.css 的 CSS 变量体系（assets/css/style.css :root / [data-theme=dark] / [data-theme=light]） */
  :root { color-scheme: dark; }
  :root, [data-theme="dark"] {
    --bg: #0b0d0f; --bg-soft: #121518; --bg-card: #15181c;
    --text: #e8eaed; --text-2: #a7adb5; --text-3: #8b929c; --text-soft: #8b929c;
    --border: rgba(255, 255, 255, 0.14); --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.14);
    --brand: #6fb3a8; --brand-text: #8fd4c6; --brand-soft: rgba(111, 179, 168, 0.35);
    --radius: 14px; --radius-sm: 9px;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    --green: #5fd08a; --orange: #e6a23c; --red: #f47067;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f8; --bg-soft: #eef0f2; --bg-card: #ffffff;
    --text: #1a1d21; --text-2: #555c66; --text-3: #5f6873; --text-soft: #5f6873;
    --border: rgba(20, 24, 30, 0.16); --line: rgba(20, 24, 30, 0.09); --line-strong: rgba(20, 24, 30, 0.16);
    --brand-text: #1c6659;
    --shadow: 0 20px 50px rgba(20, 24, 30, 0.07);
    --green: #1e9e50; --orange: #b5740c; --red: #c73e34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto,
      "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC",
      "Microsoft YaHei UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.65;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px 48px;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  .card {
    width: 100%; max-width: 880px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px;
    box-shadow: var(--shadow);
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 13px; letter-spacing: .3em; color: var(--text-3); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
  .sub { font-size: 13px; color: var(--text-2); margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  button {
    width: 100%; margin-top: 22px; padding: 11px 12px;
    background: var(--brand); color: #fff; border: 0; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: filter var(--transition);
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: var(--red); }
  .hint { margin-top: 18px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line-strong); padding-top: 14px; }

  /* 工作台视图 */
  .hidden { display: none !important; }
  .dash-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dash-actions { display: flex; align-items: center; gap: 8px; }
  .dash-user { font-size: 14px; color: var(--text-2); margin: 14px 0 6px; word-break: break-all; }
  .icon-btn {
    width: 34px; height: 34px; margin: 0; padding: 0;
    background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 15px; line-height: 1;
  }
  .btn-ghost {
    width: auto; margin: 0; padding: 8px 14px; background: transparent;
    border: 1px solid var(--border); color: var(--text-2); font-weight: 500; font-size: 13px;
  }
  .btn-ghost:hover { background: var(--bg-soft); color: var(--text); }
  .notice {
    margin: 12px 0; padding: 10px 12px; font-size: 13px; color: var(--orange);
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }

  /* 四模块网格 */
  .modules { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 640px) { .modules { grid-template-columns: 1fr; } .card { padding: 20px 16px; } }
  .module {
    background: var(--bg-soft); border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 14px 14px 10px;
  }
  .module-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .module-head h2 { margin: 0; font-size: 15px; font-weight: 650; color: var(--text); }
  .btn-add {
    width: auto; margin: 0; padding: 6px 12px;
    background: var(--brand-soft); color: var(--brand-text); border: 1px solid var(--brand-soft);
    border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
  }
  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }
  .row-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; word-break: break-all; }
  .row-sub a { color: var(--brand-text); text-decoration: none; }
  .row-sub a:hover { text-decoration: underline; }
  .row-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; word-break: break-all; }
  .row-value { font-size: 15px; font-weight: 650; color: var(--brand-text); margin-top: 2px; }
  .row-ops { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .row-ops button {
    width: auto; margin: 0; padding: 3px 9px; font-size: 12px; font-weight: 500;
    background: transparent; border: 1px solid var(--border); color: var(--text-2); border-radius: 6px;
  }
  .row-ops button:hover { background: var(--bg-soft); color: var(--text); }
  .empty { margin: 0; font-size: 12.5px; color: var(--text-3); padding: 6px 0; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: 1px;
  }
  .badge.ok, .badge.done { color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }
  .badge.warn, .badge.paused { color: var(--orange); background: color-mix(in srgb, var(--orange) 15%, transparent); }
  .badge.over, .badge.hold { color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }
  .badge.run { color: var(--brand-text); background: color-mix(in srgb, var(--brand) 18%, transparent); }

  /* 弹层 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    width: 100%; max-width: 440px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 22px 8px; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal-actions button { width: auto; margin: 0; padding: 9px 18px; }
  .modal-actions .btn-ghost { color: var(--text-2); }
</style>
</head>
<body>
  <div class="card">
    <!-- ========== 登录视图 ========== -->
    <div id="login-view">
      <div class="card-top">
        <div class="brand">Private</div>
        <button class="icon-btn" id="theme-btn-login" type="button" title="切换深浅主题">◐</button>
      </div>
      <h1>Sign in</h1>
      <p class="sub">仅限授权账户访问</p>
      <form id="login-form" autocomplete="on">
        <label for="email">邮箱</label>
        <input id="email" type="email" name="email" required autocomplete="username" placeholder="you@example.com">
        <label for="password">密码</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <button id="login-btn" type="submit">登录</button>
      </form>
      <div class="msg" id="login-msg"></div>
      <div class="hint" id="config-hint"></div>
    </div>

    <!-- ========== 工作台视图（登录后，四模块 CRUD） ========== -->
    <div id="dash-view" class="hidden">
      <div class="dash-header">
        <div class="brand">Workbench</div>
        <div class="dash-actions">
          <button class="icon-btn" id="theme-btn-dash" type="button" title="切换深浅主题">◐</button>
          <button class="btn-ghost" id="logout-btn" type="button">退出</button>
        </div>
      </div>
      <h1>工作台</h1>
      <p class="dash-user" id="dash-user"></p>
      <div class="notice hidden" id="config-notice"></div>
      <div class="modules">
        <section class="module">
          <header class="module-head">
            <h2>项目状态</h2>
            <button class="btn-add" type="button" data-kind="project">＋ 新增</button>
          </header>
          <ul class="items" id="items-project"></ul>
          <p class="empty hidden" id="empty-project">暂无记录</p>
        </section>
        <section class="module">
          <header class="module-head">
            <h2>API 余额</h2>
            <button class="btn-add" type="button" data-kind="balance">＋ 新增</button>
          </header>
          <ul class="items" id="items-balance"></ul>
          <p class="empty hidden" id="empty-balance">暂无记录</p>
        </section>
        <section class="module">
          <header class="module-head">
            <h2>快捷链接</h2>
            <button class="btn-add" type="button" data-kind="link">＋ 新增</button>
          </header>
          <ul class="items" id="items-link"></ul>
          <p class="empty hidden" id="empty-link">暂无记录</p>
        </section>
        <section class="module">
          <header class="module-head">
            <h2>备忘</h2>
            <button class="btn-add" type="button" data-kind="note">＋ 新增</button>
          </header>
          <ul class="items" id="items-note"></ul>
          <p class="empty hidden" id="empty-note">暂无记录</p>
        </section>
      </div>
      <div class="msg" id="dash-msg"></div>
    </div>
  </div>

  <!-- ========== 新增 / 编辑弹层 ========== -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal">
      <h3 id="modal-title">新增</h3>
      <form id="item-form" autocomplete="off">
        <label for="f-title">标题</label>
        <input id="f-title" type="text" maxlength="120" required>
        <div id="f-status-wrap" class="hidden">
          <label for="f-status">状态</label>
          <select id="f-status"></select>
        </div>
        <div id="f-value-wrap">
          <label id="f-value-label" for="f-value">数值</label>
          <input id="f-value" type="text" maxlength="300">
        </div>
        <label for="f-detail">备注</label>
        <textarea id="f-detail" maxlength="2000"></textarea>
        <div class="modal-actions">
          <button class="btn-ghost" id="modal-cancel" type="button">取消</button>
          <button id="modal-save" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase 客户端（本地化构建产物，禁止外链 CDN） -->
  <script src="assets/vendor/supabase/supabase.js"></script>
  <!-- 工作台应用逻辑（外部 JS，遵守站点 CSP script-src 'self'） -->
  <script src="assets/js/workbench-app.js"></script>
</body>
</html>
